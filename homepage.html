<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Industrial</title>
    <link rel="stylesheet" href="home.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
    <h1>Monitoramento Industrial</h1>

    <nav>
        <a href="home.html">Home</a>
        <button onclick="logout()">Sair</button>
    </nav>
</header>

<main>

<section class="monitoramento">

    <h2>Temperatura Atual</h2>

    <div id="temperatura" class="temperatura">
        -- °C
    </div>

    <h3 id="status">
        Carregando...
    </h3>

</section>

<section class="sobre">

    <h2>Sobre o Sistema</h2>

    <p>
        Sistema desenvolvido para monitoramento industrial utilizando
        ESP32, Supabase, HTML, CSS e JavaScript.
    </p>

</section>

</main>

<footer>
    <p>Monitoramento Industrial - Seu Nome - 2026</p>
</footer>

<script>

const SUPABASE_URL = "https://xxfyrxycbnnrizxoexre.supabase.co";
const SUPABASE_KEY = "SUA_ANON_KEY";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function verificarLogin(){

    const { data } = await supabase.auth.getUser();

    if(!data.user){
        window.location.href="login.html";
    }

}

async function carregarTemperatura(){

    const { data, error } = await supabase
    .from("leituras")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(1);

    if(error){
        console.log(error);
        return;
    }

    if(data.length==0){
        return;
    }

    const temperatura = data[0].temperatura;

    document.getElementById("temperatura").innerHTML =
    temperatura + " °C";

    const status = document.getElementById("status");

    if(temperatura < 25){

        status.innerHTML = "🟢 NORMAL - Ambiente seguro";
        status.style.color="green";

    }

    else if(temperatura <= 40){

        status.innerHTML = "🟡 ATENÇÃO - Monitorar temperatura";
        status.style.color="orange";

    }

    else{

        status.innerHTML = "🔴 CRÍTICO - Risco operacional";
        status.style.color="red";

    }

}

async function logout(){

    await supabase.auth.signOut();

    window.location.href="login.html";

}

verificarLogin();

carregarTemperatura();

setInterval(carregarTemperatura,3000);

</script>

</body>
</html>
