<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bea Truppel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>Bea Truppel</h1>
    </div>
    <input 
        id="nome" 
        type="text" 
        placeholder="Nome Completo"
        autocomplete="name"
    >
    <input 
        id="email" 
        type="email" 
        placeholder="Email"
        autocomplete="email"
    >
    <input 
        id="senha" 
        type="password" 
        placeholder="Senha (mínimo 6 caracteres)"
        autocomplete="new-password"
    >
    <input 
        id="dataNascimento" 
        type="date"
    >

    <div class="button-group">
        <button onclick="cadastrar()" class="btn-primary">
            Cadastrar
        </button>
        <button onclick="window.location.href='login.html'" class="btn-secondary">
            Login
        </button>
    </div>

    <p id="mensagem"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

</body>
</html>
